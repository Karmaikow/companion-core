name: Companion Core CI

on:
  push:
    branches:
      - feature/ollama-remoto
  pull_request:
    branches:
      - main
      - feature/evolucao-3d
      - feature/asset-studio-web

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check Studio function types
        run: npx tsc --noEmit -p api/tsconfig.json
      - name: Install browser for Studio checks
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify Studio browser flows without paid requests
        if: runner.os == 'Linux'
        run: |
          node tests/asset-studio-browser.mjs
          node tests/asset-studio-cloud-browser.mjs
          node tests/world-studio-browser.mjs
          node tests/world-auth-browser.mjs
      - name: Build Vercel preview
        run: npm run vercel:build
      - name: Prepare shared registry function
        run: npm run registry:prepare

