name: Companion Core CI

on:
  push:
    branches:
      - feature/ollama-remoto
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Vercel preview
        run: npm run vercel:build
      - name: Prepare shared registry function
        run: npm run registry:prepare

