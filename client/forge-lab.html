<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./src/styles.css"></head><body style="margin:0;background:#1a1528;overflow:auto">
<div id="root" style="position:static;height:auto"></div>
<script type="module">
// Lab da Forja e do Invocador (só no dev): prévias de habilidades e criaturas sem login. node scripts/forge-lab.mjs
import { createElement as h } from 'react';
import { createRoot } from 'react-dom/client';
import { DEFAULT_SKILLS, DEFAULT_CREATURES, WEAPON_TECHNIQUES, COMBO_FINISHERS } from '@rules';
import { SkillPreview } from './src/scene/SkillFx';
import { CreaturePreview } from './src/scene/CreaturePreview';
import { AppendageLab } from './src/scene/AppendageLab';
import { ItemPreview } from './src/scene/ItemPreview';
import { DEFAULT_ITEMS } from '@rules';
import { VfxLab, VFX_STYLES } from './src/scene/VfxLab';
const q = new URLSearchParams(location.search);
const skills = (q.get('s') ?? 'sopro-de-chamas,brasas,jato-dagua,investida,tremor,lanca-de-gelo').split(',').map((s) => DEFAULT_SKILLS.find((k) => k.slug === s)).filter(Boolean);
const look = { hue: -25, sat: 1.25, light: 0.8, contrast: 1.2, tint: '#ff6a2a', tintAmount: 0.45, glow: 0.25 };
const slimes = q.has('slimes') ? [
  ['#3fe03a', 'medroso', null, 'idle'], ['#3fd8e8', 'passivo', null, 'idle'], ['#ff3fd8', 'agressivo', null, 'attack'],
  ['#8fdc7a', 'passivo', 'natureza', 'walk'], ['#ffa04a', 'medroso', 'fogo', 'happy'], ['#a8e4ff', 'territorial', 'gelo', 'sleep'],
].map(([color, temperament, essence, act], i) => h('div', { key: 'sl' + i, style: { position: 'relative', width: 400, height: 300 } }, h(CreaturePreview, { def: { ...DEFAULT_CREATURES[0], slug: 'sl' + i, color, temperament, essence, size: 0.8 }, act }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, temperament + ' · ' + act))) : [];
const pal = { primary: '#64834b', secondary: '#9fd07a', accent: '#9e6bc7', glow: '#3fb6ff' };
const apps = q.has('cauda') ? [['scaly', null, false], ['scaly', 'dragon', true], ['fluffy', null, true], ['tuft', null, false], [null, 'feather', true], ['wisp', 'fairy', false]].map(([tail, wings, walk], i) =>
  h('div', { key: 'ap' + i, style: { position: 'relative', width: 400, height: 300 } }, h(AppendageLab, { spec: { tail, wings, palette: pal }, walk }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, [tail, wings, walk ? 'andando' : 'parado'].filter(Boolean).join(' · ')))) : [];
const itens = q.has('itens') ? DEFAULT_ITEMS.slice(Number(q.get('itens') || 0), Number(q.get('itens') || 0) + 9).map((it) => h('div', { key: it.slug, style: { position: 'relative', width: 400, height: 300 } }, h(ItemPreview, { item: it, charge: it.type === 'arco' ? 0.8 : 0 }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, it.name))) : [];
const vfx = q.get('vfx') ? (q.get('so') ? q.get('so').split(',') : VFX_STYLES).map((st) => h('div', { key: 'vfx' + st, style: { position: 'relative', width: 400, height: 300 } }, h(VfxLab, { style: st, mode: q.get('vfx') }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, st))) : [];
// técnicas de arma: ?tec=<slug>,<slug> (ou ?tec=espada para todas da arma) &estilo=chamas &congela=0.15
const tecArg = q.get('tec'), tecStyle = q.get('estilo') ?? 'impacto';
const tecAll = [...WEAPON_TECHNIQUES, ...COMBO_FINISHERS];
const tecList = tecArg ? (tecAll.some((t) => t.weapon === tecArg) ? tecAll.filter((t) => t.weapon === tecArg) : tecArg.split(',').map((s) => tecAll.find((t) => t.slug === s)).filter(Boolean)) : [];
const tecs = tecList.map((t) => h('div', { key: 'tec' + t.slug, style: { position: 'relative', width: 400, height: 300 } }, h(VfxLab, { style: tecStyle, mode: 'tec:' + t.slug }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, t.name)));
const treino = q.get('treino');
const train = treino ? [
  ...['sopro-de-chamas', 'brasas', 'golpe'].map((slug) => DEFAULT_SKILLS.find((k) => k.slug === slug)).filter(Boolean).map((s) => h('div', { key: 'tr' + s.slug, style: { position: 'relative', width: 400, height: 300 } }, h(SkillPreview, { skill: s, companionColor: '#9fc9ff', defenderEssence: null, body: { url: treino, anim: null } }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#fff' } }, 'treino · ' + s.name))),
  ...['espada-de-madeira', 'arco-curto', 'cajado-de-galho'].map((slug) => DEFAULT_ITEMS.find((i) => i.slug === slug) ?? DEFAULT_ITEMS[0]).map((it, i) => h('div', { key: 'ti' + i, style: { position: 'relative', width: 400, height: 300 } }, h(ItemPreview, { item: it, charge: 0.5, body: { url: treino, companionId: 'x', swing: true, socket: true } }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, 'treino · ' + it.name))),
] : [];
const semrig = q.get('semrig');
const sr = semrig ? ['saltitar', 'gingar', 'flutuar', 'rastejar'].map((m) => h('div', { key: 'sr' + m, style: { position: 'relative', width: 400, height: 300 } }, h(CreaturePreview, { def: { ...DEFAULT_CREATURES[0], slug: 'sr-' + m, size: 0.8, motion: m, model: { url: semrig, anims: [] } }, act: q.get('acao') ?? 'walk' }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, m + ' · ' + (q.get('acao') ?? 'walk')))) : [];
const cells = [...sr, ...train, ...vfx, ...tecs, ...itens, ...apps, ...slimes,
  ...(q.has('slimes') || q.has('cauda') || q.has('itens') || q.has('vfx') || tecArg || treino || semrig ? [] : skills).map((s) => h('div', { key: s.slug, style: { position: 'relative', width: 400, height: 300 } }, h(SkillPreview, { skill: s, companionColor: '#9fc9ff', defenderEssence: 'natureza' }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#fff' } }, s.name))),
  ...(q.has('slimes') || q.has('cauda') || q.has('itens') || q.has('vfx') || tecArg || treino || semrig ? [] : DEFAULT_CREATURES).map((c) => h('div', { key: c.slug, style: { position: 'relative', width: 400, height: 300 } }, h(CreaturePreview, { def: c, act: 'walk' }), h('b', { style: { position: 'absolute', left: 8, bottom: 6, color: '#222' } }, c.name))),
  q.get('glb') && h('div', { key: 'glb', style: { position: 'relative', width: 400, height: 300 } }, h(CreaturePreview, { def: { ...DEFAULT_CREATURES[2], slug: 'glb', look, model: { url: q.get('glb'), anims: [{ url: q.get('glb'), kind: 'walk', name: 'andando' }] } }, act: 'walk' })),
];
createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 400px)', gap: 6, padding: 6 } }, cells));
</script></body></html>
